<!doctype html>
<html lang="pt-BR">

<body>

      <span>Portal Executivo &amp; Estúdio</span>

    <section class="view" id="view-midia" data-view="midia"></section>

<div id="modal-root"></div>
<div id="toasts" aria-live="polite"></div>
